# ==============================================================================
# Nginx Reverse Proxy Configuration for NHSO Authen Service
# Service Port: 4100
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Standalone Virtual Host (แนะนำ: เรียกผ่าน IP เครื่อง หรือ Domain ตรงๆ เช่น Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name _; # หรือใส่ Domain เช่น nhso-authen.hospital.local หรือ IP ของ Server

    # ขนาด Body สูงสุดที่ยอมให้ส่งเข้ามา (Token JSON ปกติไม่เกิน 1-2 MB)
    client_max_body_size 20M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        # ชี้ไปยัง Node.js App ที่รันอยู่บน Port 4100
        proxy_pass http://127.0.0.1:4100;

        # HTTP Version
        proxy_http_version 1.1;

        # ส่งผ่าน IP จริงของ Client ไปยัง Express (สำคัญมากสำหรับระบบตรวจ Subnet IP)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # รองรับ WebSocket / SSE (กรณีต้องการ Live Update)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ปิด Buffer เพื่อให้ Response ส่งตรงทันที
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}

